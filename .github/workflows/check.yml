name: Перевірка еталоном

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Тестова версія
        run: node tools/check.mjs test/index.html
      - name: Робоча версія
        run: node tools/check.mjs index.html

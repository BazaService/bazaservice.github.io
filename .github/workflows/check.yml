name: Перевірка еталоном

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Тестова версія
        run: node tools/check.mjs test/index.html
      # Робоча версія може відставати від нового еталону, поки її не перенесли — тоді це лише довідка.
      # Коли робоча = тестова (після перенесення), перевірка обов'язкова.
      - name: Робоча версія
        run: |
          if cmp -s index.html test/index.html; then node tools/check.mjs index.html
          else node tools/check.mjs index.html || echo "ℹ️ Робоча версія старіша за еталон — це нормально, поки нову не перенесли"; fi

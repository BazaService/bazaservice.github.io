<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Baza Service</title>
<meta name="theme-color" content="#0F0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baza Service">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;min-height:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column like a cash ledger; bottom tab bar + "+" button for thumb use on a phone */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#F7F7F5; --line:#E0E0DC; --ink:#121212; --muted:#6B6B68;
  --accent:#161616; --accent-ink:#FFFFFF; --accent-soft:#ECECEA;
  --out:#B23A2E; --out-soft:#F7E6E3; --in:#24784A; --in-soft:#E2F0E7;
  --move:#4A5568; --move-soft:#E9EBEF; --fx:#8A6418; --fx-soft:#F3ECDD; --inv:#3F3F3F; --inv-soft:#EAEAE8;
  --shadow:0 10px 30px rgba(0,0,0,.16); --hero:#161616; --hero-ink:#FFFFFF;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Unbounded','Manrope',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F; --surface:#191919; --surface-2:#202020; --line:#2E2E2E; --ink:#EDEDEB; --muted:#9C9C98;
  --accent:#F2F2F0; --accent-ink:#111111; --accent-soft:#2A2A2A;
  --out:#EE8A7C; --out-soft:#3A2321; --in:#78CF98; --in-soft:#1C3125; --move:#B4BDCB; --move-soft:#252A31; --fx:#DDB467; --fx-soft:#352C1A; --inv:#D6D6D2; --inv-soft:#2A2A2A;
  --shadow:0 10px 30px rgba(0,0,0,.55); --hero:#232323; --hero-ink:#F2F2F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#191919; --surface-2:#202020; --line:#2E2E2E; --ink:#EDEDEB; --muted:#9C9C98;
  --accent:#F2F2F0; --accent-ink:#111111; --accent-soft:#2A2A2A;
  --out:#EE8A7C; --out-soft:#3A2321; --in:#78CF98; --in-soft:#1C3125; --move:#B4BDCB; --move-soft:#252A31; --fx:#DDB467; --fx-soft:#352C1A; --inv:#D6D6D2; --inv-soft:#2A2A2A;
  --shadow:0 10px 30px rgba(0,0,0,.55); --hero:#232323; --hero-ink:#F2F2F0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,4.6vw,20px);margin:0;letter-spacing:-.01em}
header.top .r{display:flex;align-items:center;gap:10px}
header.top .who{color:var(--muted);font-size:13px}
.gear{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.gear.on{color:var(--accent);border-color:var(--accent)}
.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--in)} .neg{color:var(--out)}

/* Hero: balance */
.hero{background:var(--hero);color:var(--hero-ink);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:700}
.hero .num{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,8vw,38px);letter-spacing:-.02em;margin-top:4px}
.hero .sub{margin-top:6px;font-size:13px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:460px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:18px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{font-size:12px;color:var(--muted);margin-top:8px}
.warn-card{background:var(--fx-soft);color:var(--fx);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;margin-top:10px}
.warn-card a{color:inherit}

.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.box:hover{border-color:var(--accent)}
.box .name{font-weight:700}
.box .bal{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.box .bal .neg{color:var(--out)}
.box .empty{font-size:13px;color:var(--muted)}
.box .eq{font-size:12px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:800;background:var(--surface-2)}
tr.sec td{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
td.ind{padding-left:22px}
tr.click{cursor:pointer}.stat.click,.hero.click{cursor:pointer}.stat.click:active,.hero.click:active{opacity:.75}tr.click:active td{background:var(--surface-2)}
td .an{display:block;font-size:12px;color:var(--muted);font-weight:400}
td.code{font-weight:800}
.fxn{display:block;font-size:12.5px;line-height:1.4;margin:4px 0 2px;font-weight:400}.fxl{display:block;margin-top:5px}.fxr{font-weight:700}
.acl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px;align-items:center;margin:6px 0}.acl span{font-size:14px;overflow-wrap:anywhere}.acl select{width:100%;min-width:0}.acc-sub{display:block;margin:14px 0 4px}
table.osv{font-size:13px}table.osv th,table.osv td{padding:8px 6px}table.osv th:first-child,table.osv td:first-child{padding-left:10px}table.osv th:last-child,table.osv td:last-child{padding-right:10px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px;font-size:14px}
.crumbs button{background:none;border:0;color:var(--accent,inherit);text-decoration:underline;padding:4px 0;font:inherit;cursor:pointer}
.okline{font-size:13px;margin:8px 2px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.empty-state b{color:var(--ink)}

/* Clients */
.clients{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.cl:last-child{border-bottom:0}
.cl:hover{background:var(--surface-2)}
.cl .n{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.cl .b{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:14px}
.cl .b .w{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.cl .eq{font-size:12px;color:var(--muted)}
.dbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px}
.dtog{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.dtog button{border:0;background:none;border-radius:7px;padding:5px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.dtog button.on{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}
.tile .v{grid-column:1;font-family:var(--font-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .go{grid-column:2;grid-row:1/3;font-size:12px;color:var(--muted);font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.duo.duo3{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.duo3 .stat .v{font-size:clamp(13px,3.8vw,18px);white-space:normal;overflow-wrap:anywhere}
.ratebox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 10px;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;text-align:center;min-width:72px}
.ratebox .rl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ratebox .ri{display:flex;flex-direction:column;line-height:1.2}
.ratebox .rk{font-size:11px;color:var(--muted)}
.ratebox b{font-size:14px;white-space:nowrap}
.ratebox .rs{font-size:10px;color:var(--muted)}

/* Filters */
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filters .full{grid-column:1/-1}
@media (min-width:620px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent)}
textarea{resize:vertical}
input,select,textarea{font-size:16px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Journal */
.day{margin-top:18px}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.day-h .d{font-weight:800;text-transform:capitalize}
.day-h .tot{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.ops{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.op{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.op:last-child{border-bottom:0}
.op:hover{background:var(--surface-2)}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.c-out{color:var(--out)} .bg-out{background:var(--out-soft);color:var(--out)}
.c-in{color:var(--in)} .bg-in{background:var(--in-soft);color:var(--in)}
.c-move{color:var(--move)} .bg-move{background:var(--move-soft);color:var(--move)}
.c-fx{color:var(--fx)} .bg-fx{background:var(--fx-soft);color:var(--fx)}
.c-inv{color:var(--inv)} .bg-inv{background:var(--inv-soft);color:var(--inv)}
.tagcol{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;max-width:96px}
.who-s{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.op .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .a{text-align:right;font-weight:800;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;font-size:13px}
.eod{margin-top:6px}
.more{display:block;margin:18px auto 0}
.legend{font-size:12px;color:var(--muted);margin-top:10px}

/* Report bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.bar-row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bar-row .v{font-weight:800;text-align:right}
.bar-row .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--out);border-radius:4px}
.bar-row .fill.oz{background:var(--inv)}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;padding:13px;font-size:16px}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.danger.solid{background:var(--out);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

/* Nav + FAB */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs a.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;line-height:1;box-shadow:var(--shadow)}
@media (min-width:800px){.fab{right:calc(50% - 380px)}}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700}
.x{background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg-b{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.seg.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.kinds .seg-b{border-radius:12px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15}
.seg.kinds .sg{font-size:24px;font-weight:800}
.seg.kinds .cap{font-size:11px;font-weight:700;opacity:.85}
.seg-b.on.t-out{background:var(--out);color:var(--surface);border-color:var(--out)}
.seg-b.on.t-in{background:var(--in);color:var(--surface);border-color:var(--in)}
.seg-b.on.t-move{background:var(--move);color:var(--surface);border-color:var(--move)}
.seg-b.on.t-fx{background:var(--fx);color:var(--surface);border-color:var(--fx)}
.seg-b.on.t-inv{background:var(--inv);color:var(--surface);border-color:var(--inv)}
.pay{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.pay button{border:0;background:none;border-radius:8px;padding:8px;font-weight:700;font-size:13px;color:var(--muted)}
.pay button.on{background:var(--accent-soft);color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hint{font-size:12px;color:var(--muted);min-height:1em}
.hint.warn{color:var(--out);font-weight:700}
.calc{background:var(--fx-soft);color:var(--fx);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;margin-bottom:10px}
.err{color:var(--out);font-weight:700;margin:4px 0 10px;min-height:1em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin-bottom:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* Settings */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.li.rate{grid-template-columns:70px minmax(0,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.olist{display:flex;flex-direction:column}
.orow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ctl{display:flex;gap:6px;align-items:center;flex-shrink:0}
.mv{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:800;font-size:16px;line-height:1}
.mv:disabled{opacity:.3;cursor:default}
.mv.del{color:var(--out)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:13px}

<script type="module">
let initializeApp,getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,fdoc,fcol,setDoc,getDoc,fsnap,writeBatch,firebaseConfig;
const SDK='https://www.gstatic.com/firebasejs/11.0.2/';
async function loadSdk(){
  const [a,b,c,d]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js'),import('./firebase-config.js')]);
  ({initializeApp}=a);
  ({getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut}=b);
  ({initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc:fdoc,collection:fcol,setDoc,getDoc,onSnapshot:fsnap,writeBatch}=c);
  ({firebaseConfig}=d);
}
(function(){
"use strict";
/* ---------- Firebase layer (replaces Claude runtime) ---------- */
const FB={};
function initFB(){
FB.app=initializeApp(firebaseConfig);
FB.auth=getAuth(FB.app);
FB.fs=initializeFirestore(FB.app,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
}
function writeErr(e){try{window.dispatchEvent(new CustomEvent('fb-write-error',{detail:e}));}catch(_){} }
function mkDoc(path){const ref=fdoc(FB.fs,path);return{
  set(data){setDoc(ref,data).catch(writeErr);return Promise.resolve();},
  update(data){setDoc(ref,data,{merge:true}).catch(writeErr);return Promise.resolve();},
  async get(){const s=await getDoc(ref);return {exists:s.exists(),data:()=>s.data()};},
  onSnapshot(cb,err){return fsnap(ref,s=>cb({exists:s.exists(),data:()=>s.data()}),err||(()=>{}));}
};}
function mkCol(path){const ref=fcol(FB.fs,path);return{
  onSnapshot(cb,err,meta){return fsnap(ref,{includeMetadataChanges:!!meta},s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data(),pending:d.metadata.hasPendingWrites})),fromCache:s.metadata.fromCache}),err||(()=>{}));}
};}
const fbdb={doc:mkDoc,collection:mkCol};
/*LOGIC*/
const BASE='UAH';
const SYM={UAH:'₴',USD:'$',EUR:'€',PLN:'zł',GBP:'£'};
const TYPES={
  expense:{label:'Витрата',cls:'out'},
  income:{label:'Дохід',cls:'in'},
  clientIn:{label:'Від клієнта',cls:'inv'},
  clientOut:{label:'Клієнту',cls:'inv'},
  transfer:{label:'Переказ',cls:'move'},
  exchange:{label:'Обмін',cls:'fx'}
};
const DEFAULT_CFG={boxes:[],categories:['Інше'],incomeCategories:['Інший дохід'],currencies:['UAH','USD','EUR'],rates:{}};
let cfg=null,days={},clients={};

function r2(n){return Math.round((+n||0)*100)/100;}
function C(){return cfg||DEFAULT_CFG;}
function allOps(){
  const out=[];
  for(const d in days){const ops=days[d]||{};for(const id in ops){const o=ops[id];if(o&&!o.deleted&&o.type)out.push(Object.assign({},o,{id,day:d}));}}
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  return out;
}
/* Cash effects on boxes: [box,cur,amount] */
function effects(o){
  const a=+o.amount||0;
  switch(o.type){
    case 'expense':return o.payVia==='client'?[]:[[o.from,o.cur,-a]];
    case 'income':return o.payVia==='client'?[]:[[o.to,o.cur,a]];
    case 'clientIn':return [[o.to,o.cur,a]];
    case 'clientOut':return [[o.from,o.cur,-a]];
    case 'transfer':return [[o.from,o.cur,-a],[o.to,o.cur,a]];
    case 'exchange':return [[o.from,o.cur,-a],[o.to,o.cur2,+o.amount2||0]];
  }
  return [];
}
/* Client effects: positive = client owes me, negative = I owe client */
function clientEffects(o){
  const a=+o.amount||0;
  switch(o.type){
    case 'expense':return o.payVia==='client'?[[o.client,o.cur,-a]]:[];
    case 'income':return o.payVia==='client'?[[o.client,o.cur,a]]:[];
    case 'clientIn':return [[o.client,o.cur,-a]];
    case 'clientOut':return [[o.client,o.cur,a]];
  }
  return [];
}
function sumInto(map,list){for(const [k,cur,a] of list){if(!k||!cur)continue;map[k]=map[k]||{};map[k][cur]=r2((map[k][cur]||0)+a);}}
function boxBalances(ops,uptoDay,skipId){const b={};for(const o of ops){if(uptoDay&&o.date>uptoDay)continue;if(skipId&&o.id===skipId)continue;sumInto(b,effects(o));}return b;}
function clientBalances(ops){const b={};for(const o of ops)sumInto(b,clientEffects(o));return b;}
function totalsByCur(bal){const t={};for(const k in bal)for(const c in bal[k])t[c]=r2((t[c]||0)+bal[k][c]);return t;}

/* Exchange rate history (UAH per 1 unit) from exchanges that involve UAH */
function rateHistory(ops){
  const h={};
  for(const o of ops){
    if(o.type!=='exchange'||!(o.amount>0)||!(o.amount2>0))continue;
    let cur=null,r=null;
    if(o.cur2===BASE&&o.cur!==BASE){cur=o.cur;r=o.amount2/o.amount;}
    else if(o.cur===BASE&&o.cur2!==BASE){cur=o.cur2;r=o.amount/o.amount2;}
    if(cur)(h[cur]=h[cur]||[]).push({date:o.date,ts:o.ts||0,rate:r});
  }
  return h;
}
function currentRate(cur,hist){
  if(cur===BASE)return 1;
  const m=C().rates&&+C().rates[cur];
  if(m>0)return m;
  const l=hist[cur];return l&&l.length?l[l.length-1].rate:null;
}
function lastExchange(cur,hist){const l=hist[cur];return l&&l.length?l[l.length-1]:null;}
function rateAt(cur,date,hist){
  if(cur===BASE)return 1;
  const l=hist[cur]||[];let r=null;
  for(const x of l){if(x.date<=date)r=x.rate;else break;}
  if(r==null&&l.length)r=l[0].rate;
  if(r==null)r=currentRate(cur,hist);
  return r;
}
/* Whole model for one render */
function model(){
  const ops=allOps();const hist=rateHistory(ops);const missing=new Set();
  const nowR=cur=>{const r=currentRate(cur,hist);if(r==null){missing.add(cur);return 0;}return r;};
  const opR=(cur,date)=>{const r=rateAt(cur,date,hist);if(r==null){missing.add(cur);return 0;}return r;};
  const boxes=boxBalances(ops),cli=clientBalances(ops);
  const cash=totalsByCur(boxes);
  let cashU=0;for(const c in cash)cashU+=cash[c]*nowR(c);
  let owedToMe=0,iOwe=0;const owedCur={},oweCur={};
  for(const k in cli){let v=0;for(const c in cli[k])v+=cli[k][c]*nowR(c);
    if(v>0)owedToMe+=v;else iOwe+=-v;
    const tgt=v>0.004?owedCur:v<-0.004?oweCur:null;
    if(tgt)for(const c in cli[k]){const a=v>0?cli[k][c]:-cli[k][c];tgt[c]=r2((tgt[c]||0)+a);}}
  const balance=r2(cashU+owedToMe-iOwe);
  const pl=o=>{const u=(+o.amount||0)*opR(o.cur,o.date);return o.type==='income'?u:o.type==='expense'?-u:0;};
  const months={};let plAll=0;
  for(const o of ops){if(o.type!=='income'&&o.type!=='expense')continue;const v=pl(o);plAll+=v;const m=o.date.slice(0,7);const x=months[m]=months[m]||{inc:0,exp:0,oz:0};if(o.type==='income')x.inc+=v;else if(o.isAsset)x.oz+=-v;else x.exp+=-v;}
  plAll=r2(plAll);
  const L=ledger(ops,nowR,opR);
  return {ops,hist,missing,boxes,cli,cash,cashU:r2(cashU),owedToMe:r2(owedToMe),iOwe:r2(iOwe),owedCur,oweCur,balance,plAll,fxDiff:r2(balance-plAll),months,nowR,opR,pl,posts:L.posts};
}

/* ---------- Управлінський подвійний запис ---------- */
/* Рахунки: sec a — активи, p — капітал і зобов'язання, i — доходи, e — витрати */
const ACC={
  '10':['Основні засоби','a'],'20':['Запаси','a'],'23':['Виробництво (заказ-наряди)','a'],
  '301':['Каса в гривні','a'],'302':['Каса в валюті','a'],'31':['Рахунки в банках','a'],
  '36':['Розрахунки з покупцями','a'],'371':['Видані аванси','a'],'372':['Підзвітні особи','a'],'377':['Інші дебітори і кредитори','a'],
  '40':['Капітал','p'],'44':['Нерозподілений прибуток','p'],'60':['Позики (інвестор)','p'],'63':['Розрахунки з постачальниками','p'],
  '641':['Розрахунки за податками','p'],'642':['Військовий збір','p'],'651':['ЄСВ','p'],'66':['Розрахунки з оплати праці','p'],
  '684':['Відсотки до сплати','p'],'685':['Інші кредитори','p'],
  '702':['Дохід від продажу запчастин','i'],'703':['Дохід від робіт і послуг','i'],'714':['Дохід від курсової різниці','i'],'719':['Інші доходи','i'],
  '90':['Собівартість','e'],'91':['Загальновиробничі витрати','e'],'92':['Адміністративні витрати','e'],'93':['Витрати на збут','e'],
  '945':['Втрати від курсової різниці','e'],'949':['Інші витрати','e'],'951':['Відсотки за позиками','e'],'98':['Податки ФОП','e']
};
const ACC_ORDER=['10','20','23','301','302','31','36','371','372','377','40','44','60','63','641','642','651','66','684','685','702','703','714','719','90','91','92','93','945','949','951','98'];
const ACC_SEC={a:'Активи',p:'Капітал і зобов\'язання',i:'Доходи',e:'Витрати'};
const EXP_ACCS=['91','92','93','949','951','98','90'];
const INC_ACCS=['703','702','719'];
const CLIENT_KINDS={other:['Інший','377'],investor:['Інвестор','60'],buyer:['Покупець','36'],supplier:['Постачальник','63'],employee:['Працівник','372'],bank:['Банк','31']};
const ORGS=[['cash','Готівка'],['tov','ТОВ «БАЗА СЕРВІС»'],['fop3','ФОП 3 група'],['fop2','ФОП 2 група']];
const OZ_CAT='Основні засоби';
function acctCfg(){return C().acct||{};}
function clientKind(id){const k=(acctCfg().clients||{})[id];if(CLIENT_KINDS[k])return k;
  /* Без налаштування — за назвою: «інвестор…» → Інвестор, «банк…» → Банк */
  const n=String((clients[id]&&clients[id].name)||(C().legacyNames||{})[id]||'').toLowerCase();
  return /інвестор/.test(n)?'investor':/банк/.test(n)?'bank':'other';}
function clientAcc(id){return CLIENT_KINDS[clientKind(id)][1];}
function expAcc(cat){const m=(acctCfg().exp||{})[cat];return ACC[m]?m:(cat===OZ_CAT||cat==='Інше'?'949':'91');}
function incAcc(cat){const m=(acctCfg().inc||{})[cat];return ACC[m]?m:'719';}
function boxOrg(id){const b=C().boxes.find(x=>x.id===id);return b&&b.org||'cash';}
function cashAcc(cur){return cur===BASE?'301':'302';}
/* Одна сторона проводки: рахунок, аналітика (an), валюта і сума у валюті */
function lf(v,c){return (Math.round(v*100)/100).toLocaleString('uk-UA',{maximumFractionDigits:2})+' '+({UAH:'₴',USD:'$',EUR:'€'}[c]||c);}
function side(acc,an,cur,amt){return {acc,an,cur:cur||BASE,amt:r2(amt)};}
/* Назви для пояснень (у LOGIC немає доступу до функцій інтерфейсу) */
function lbBox(id){const b=C().boxes.find(x=>x.id===id);return b?b.name:'каса';}
function lbCli(id){return (clients[id]&&clients[id].name)||(C().legacyNames||{})[id]||'клієнт';}
function ldm(d){return d?d.slice(8,10)+'.'+d.slice(5,7):'';}
function lr(r){return (Math.round(r*10000)/10000).toLocaleString('uk-UA',{maximumFractionDigits:4});}
/* Як операція називається в поясненні — так само, як у журналі */
function opLabel(o){
  const a=lf(+o.amount||0,o.cur);
  switch(o.type){
    case 'clientIn':return `Від клієнта «${lbCli(o.client)}» ${a} в «${lbBox(o.to)}»`;
    case 'clientOut':return `Клієнту «${lbCli(o.client)}» ${a} з «${lbBox(o.from)}»`;
    case 'transfer':return `Переказ ${a} з «${lbBox(o.from)}» в «${lbBox(o.to)}»`;
    case 'exchange':return o.from===o.to?`Обмін ${a} → ${lf(+o.amount2||0,o.cur2)} в «${lbBox(o.to)}»`:`Обмін ${a} з «${lbBox(o.from)}» → ${lf(+o.amount2||0,o.cur2)} в «${lbBox(o.to)}»`;
    case 'expense':return `Витрата «${o.isAsset?OZ_CAT:(o.category||'Інше')}» ${a}${o.payVia==='client'?' через «'+lbCli(o.client)+'»':' з «'+lbBox(o.from)+'»'}`;
    case 'income':return `Дохід «${o.category||'Інший дохід'}» ${a}${o.payVia==='client'?' через «'+lbCli(o.client)+'»':' в «'+lbBox(o.to)+'»'}`;
  }
  return o.type;
}
/* Проводки. Валюта рахується партіями (FIFO): кожна партія пам'ятає, звідки прийшла і за яким курсом.
   Перший прийшов — перший пішов. Перекази між касами переносять партії з їхнім курсом.
   Курсова різниця з'являється, коли валюта йде за іншою вартістю, ніж прийшла (714 / 945),
   і в кінці — переоцінка того, що лишилось, за поточним курсом. Витрати і доходи — за курсом дня. */
function ledger(ops,nowR,opR){
  const posts=[],pos={};
  const P=(s,org)=>{const k=s.acc+'|'+s.an+'|'+s.cur+'|'+org;return pos[k]=pos[k]||{s,org,lots:[]};};
  const qty=x=>x.lots.reduce((t,l)=>t+l.q,0);
  /* Рух k (+1 дебет, −1 кредит) на a одиниць валюти: спершу гасимо партії протилежного знаку */
  function consume(x,k,a){
    const used=[];let left=a,cost=0;
    while(left>1e-9&&x.lots.length&&Math.sign(x.lots[0].q)===-k){
      const l=x.lots[0],take=Math.min(Math.abs(l.q),left);
      used.push({q:take,r:l.r,src:l.src});cost+=take*l.r;left-=take;l.q+=k*take;
      if(Math.abs(l.q)<1e-9)x.lots.shift();
    }
    return {used,cost:r2(cost),rem:r2(left)};
  }
  const push=(o,dt,kt,sum,note,extra)=>{sum=r2(sum);if(!sum)return;posts.push(Object.assign({date:o.date,ts:o.ts||0,opId:o.id||null,day:o.day||null,dt,kt,sum,org:o.payVia==='client'?'cash':boxOrg(o.from||o.to),note:note||''},extra||{}));};

/* Курсова різниця «від сьогоднішнього курсу»: кожна операція, де валюта перетворилась на гривні
   (обмін, витрата чи дохід у валюті), порівнюється з тим, скільки це коштувало б сьогодні.
   Сума всіх рядків = курсова різниця на екрані «Гроші». Курс, за яким валюта прийшла, тут не потрібен. */
function fxToday(ops,nowR,opR){
  const rows=[];
  for(const o of ops){
    const a=+o.amount||0,d={};
    const add=(c,v)=>{if(c&&c!==BASE)d[c]=(d[c]||0)+v;};
    let pl=0;
    if(o.type==='exchange'){add(o.cur,-a);add(o.cur2,+(+o.amount2||0));}
    else if(o.type==='income'){add(o.cur,a);if(o.cur!==BASE)pl=a*opR(o.cur,o.date);}
    else if(o.type==='expense'){add(o.cur,-a);if(o.cur!==BASE)pl=-a*opR(o.cur,o.date);}
    else continue;
    const cs=Object.keys(d).filter(c=>d[c]);if(!cs.length)continue;
    let now=0;for(const c of cs)now+=d[c]*nowR(c);
    /* для обміну гривнева сторона — реальні гривні */
    let uah=0;if(o.type==='exchange'){if(o.cur===BASE)uah=-a;if(o.cur2===BASE)uah+=+o.amount2||0;}
    const v=r2(o.type==='exchange'?uah+now:now-pl);
    const c=cs[0],q=Math.abs(d[c]);
    const rate=o.type==='exchange'&&(o.cur===BASE||o.cur2===BASE)?Math.abs(uah)/q:opR(c,o.date);
    rows.push({o,cur:c,q,rate,now:nowR(c),v,kind:o.type==='exchange'?(d[c]<0?'sell':'buy'):o.type});
  }
  return rows;
}
/* Оборотно-сальдова відомість. from/to — межі періоду (рядки YYYY-MM-DD, '' — без межі).
   by: 'acc' — по рахунках, або назва рахунку — по аналітиці цього рахунку.
   Сальдо: + дебетове, − кредитове. */
function osv(posts,from,to,org,acc){
  const rows={};const get=k=>rows[k]=rows[k]||{key:k,open:0,dt:0,kt:0,close:0,cur:{}};
  for(const p of posts){
    if(org&&p.org!==org)continue;if(to&&p.date>to)continue;
    const before=from&&p.date<from;
    for(const [s,k] of [[p.dt,1],[p.kt,-1]]){
      if(acc&&s.acc!==acc)continue;
      const x=get(acc?s.an:s.acc);
      if(before)x.open+=k*p.sum;else if(k>0)x.dt+=p.sum;else x.kt+=p.sum;
      if(s.cur!==BASE)x.cur[s.cur]=r2((x.cur[s.cur]||0)+k*s.amt);
    }
  }
  for(const k in rows){const x=rows[k];x.open=r2(x.open);x.dt=r2(x.dt);x.kt=r2(x.kt);x.close=r2(x.open+x.dt-x.kt);}
  return rows;
}

function perevirkaBody(M){

async function resetEtalon(){
  if(!isOwner||!db){toast('Скидати може тільки власник');return;}
  if(!IS_TEST||!/-test$/.test(firebaseConfig.projectId||'')){toast('Скидання дозволене тільки в тестовій базі');return;}
  if(!navigator.onLine){toast('Для скидання потрібен інтернет');return;}
  resetBusy=true;renderTestBar();
  try{
    if(!ETA)ETA=await import('./etalon.js');
    const e=ETA.etalonData(thisMonth());
    const b=writeBatch(FB.fs);
    for(const d in days)if(!e.days[d])b.delete(fdoc(FB.fs,'days/'+d));
    for(const id in clients)if(!e.clients[id])b.delete(fdoc(FB.fs,'clients/'+id));
    b.set(fdoc(FB.fs,'config/main'),Object.assign({},e.config,{etalonMonth:thisMonth()}));
    for(const id in e.clients)b.set(fdoc(FB.fs,'clients/'+id),e.clients[id]);
    for(const d in e.days)b.set(fdoc(FB.fs,'days/'+d),{ops:e.days[d]});
    await b.commit();
    toast('Тестову базу скинуто до еталону');location.hash='#perevirka';
  }catch(err){toast('Не вдалося скинути: '+(err.code||err.message));}
  resetBusy=false;resetAsk=false;renderTestBar();
}

function catOf(o){return o.type==='expense'&&o.isAsset?'Основні засоби':o.category;}
function filteredOps(ops){
  const f=ui.f,q=f.q.trim().toLowerCase();
  return ops.filter(o=>{
    if(f.from&&o.date<f.from)return false;if(f.to&&o.date>f.to)return false;
    if(f.type&&o.type!==f.type)return false;
    if(f.cat&&catOf(o)!==f.cat)return false;
    if(f.box&&!effects(o).some(e=>e[0]===f.box))return false;
    if(f.client&&o.client!==f.client)return false;
    if(q&&!((o.comment||'')+' '+(o.category||'')+' '+(o.assetName||'')).toLowerCase().includes(q))return false;
    return true;
  });
}
function opTitle(o){
  const via=o.payVia==='client'?'через '+clientName(o.client):null;
  switch(o.type){
    case 'expense':return [o.isAsset?'ОЗ: '+(o.assetName||'без назви'):(o.category||'Витрата'),via||boxName(o.from)];
    case 'income':return [o.category||'Дохід',via||boxName(o.to)];
    case 'clientIn':return ['Від: '+clientName(o.client),'в '+boxName(o.to)];
    case 'clientOut':return ['Віддав: '+clientName(o.client),'з '+boxName(o.from)];
    case 'transfer':return [boxName(o.from)+' → '+boxName(o.to),'Переказ'];
    case 'exchange':return ['Обмін '+o.cur+' → '+o.cur2,boxName(o.from)+(o.to!==o.from?' → '+boxName(o.to):'')+' · курс '+fmtRate(o.rate)];
  }
  return ['?',''];
}

function reportBody(M){
  const m=ui.rep.month;

    else{

      const who=o.payVia==='client'?'через '+clientName(o.client):boxName(o.from);byWho[who]=(byWho[who]||0)+u;
    }
  }
  const res=tInc-tExp-tOz;
  const title=m?monthLabel(m):'Весь час';
  let h=`<div class="card audit-card" style="margin-bottom:12px"><div><b>Рахунки</b><div class="small muted">Оборотно-сальдова відомість: кожна сума розкривається до операції</div></div><button class="btn" type="button" data-act="accgo" data-v="${esc('||'+(m||''))}">Відкрити</button></div>`+missingWarn(M);

    h+=`<tr class="sec click" data-act="accgo" data-v="${esc('||'+(m||'')+'|inc')}"><td>Доходи ›</td><td>${fmtU(tInc)}</td></tr>`;

  h+=`<div style="margin-top:26px">${auditCard()}</div>`;
  return h;
}

/* ---------- Рахунки: ОСВ → рахунок → аналітика → проводки → операція ---------- */
function fmtN(v){const x=r2(v);return x?Math.abs(x).toLocaleString('uk-UA',{minimumFractionDigits:Number.isInteger(x)?0:2,maximumFractionDigits:2}):'';}
function fmtS(v){const x=r2(v);return x?fmtN(x)+(x>0?' Дт':' Кт'):'';}
function anLabel(an){if(!an)return '—';if(an==='exch')return 'Обмін валют';if(an.startsWith('rev:')){const [acc,inner]=an.slice(4).split('~');return 'Переоцінка: '+anLabel(inner)+' ('+acc+')';}if(an.startsWith('fx:')){const [acc,inner]=an.slice(3).split('~');return 'Курсова різниця: '+anLabel(inner)+' ('+acc+')';}const i=an.indexOf(':');const k=an.slice(0,i),v=an.slice(i+1);return k==='box'?boxName(v):k==='cli'?clientName(v):v;}

  const list=M.posts.filter(p=>(!a.org||p.org===a.org)&&(!from||p.date>=from)&&(!to||p.date<=to)&&((p.dt.acc===a.acc&&p.dt.an===a.an)||(p.kt.acc===a.acc&&p.kt.an===a.an)));
  if(!list.length)return h+`<div class="empty-state">За цей період проводок немає.</div>`;

/* Валютна позиція по кожній валюті: скільки маємо (каси + нам винні), скільки винні ми */
function fxPosition(M){
  const P={};const g=c=>P[c]=P[c]||{cash:0,owedMe:0,iOwe:0};
  for(const c in M.cash)if(c!==BASE)g(c).cash+=M.cash[c];
  for(const k in M.cli)for(const c in M.cli[k]){if(c===BASE)continue;const v=M.cli[k][c];if(v>0)g(c).owedMe+=v;else g(c).iOwe+=-v;}
  for(const c in P){const x=P[c];x.cash=r2(x.cash);x.owedMe=r2(x.owedMe);x.iOwe=r2(x.iOwe);x.net=r2(x.cash+x.owedMe-x.iOwe);}
  return P;
}
function fxNeedLine(M){
  const P=fxPosition(M);return Object.keys(P).filter(c=>Math.abs(P[c].net)>=0.01).map(c=>P[c].net<0?`Треба докупити ${fmt(-P[c].net,c)}`:`Зайвих ${fmt(P[c].net,c)}`).join(' · ');
}
function fxScreen(M){
  const lr2=x=>(Math.round(x*100)/100).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
  const rows=fxToday(M.ops,M.nowR,M.opR);const P=fxPosition(M);
  const curs=[...new Set([...Object.keys(P),...rows.map(r=>r.cur)])];
  let total=0;for(const r of rows)total+=r.v;total=r2(total);
  let h=`<section class="hero"><div class="lbl">Курсова різниця</div><div class="num ${sgn(total)}">${fmtU(total,true)}</div>
    <div class="sub">Курс сьогодні: ${curs.map(c=>`${esc(c)} ${lr2(M.nowR(c))}`).join(' · ')} — міняється щодня, тому і ця сума щодня інша</div></section>`;
  for(const c of curs){
    /* Отримали / віддали валюту від клієнтів — курс не важливий */
    const io=M.ops.filter(o=>(o.type==='clientIn'||o.type==='clientOut')&&o.cur===c);
    if(io.length){
      h+=`<h2>Отримали і віддали ${esc(c)}</h2><div class="tbl-wrap"><table class="osv"><tbody>${io.map(o=>`<tr class="click" data-act="opview" data-v="${esc(o.day+'|'+o.id)}"><td>${shortDate(o.date).slice(0,5)} · ${o.type==='clientIn'?'Від':'Клієнту'} «${esc(clientName(o.client))}» ›</td><td><b>${o.type==='clientIn'?'+':'−'}${fmt(+o.amount,c)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="small muted" style="margin:6px 2px 4px">Курс тут не важливий: борги в ${esc(c)} повертаються тією ж валютою.</div>`;
    }
    const rs=rows.filter(r=>r.cur===c);
    if(rs.length){
      let t=0,q=0;
      const tr=rs.map(r=>{t+=r.v;const o=r.o;const sell=r.kind==='sell'||r.kind==='expense';q+=sell?r.q:-r.q;
        const diff=sell?r.rate-r.now:r.now-r.rate;
        const what=r.kind==='sell'?'':r.kind==='buy'?'купили ':r.kind==='expense'?'витрата ':'дохід ';
        return `<tr class="click" data-act="opview" data-v="${esc(o.day+'|'+o.id)}"><td>${shortDate(o.date).slice(0,5)} ${what}${fmt(r.q,c)} ›</td><td>${lr2(r.rate)}</td><td>${diff>=0?'+':'−'}${lr2(Math.abs(diff))}</td><td class="${sgn(r.v)}"><b>${fmtU(r.v,true)}</b></td></tr>`;}).join('');

function cleanOp(o){if(!o)return null;const c=Object.assign({},o);delete c.id;delete c.day;return c;}
function newAuditCount(){return audit.filter(e=>e.action!=='create'&&e.ts>auditSeen&&e.by!==me.id).length;}
async function logAudit(action,opId,before,after){
  if(!db||!me.id)throw {code:'no_id'};
  const ts=Date.now();const eid=ts.toString(36)+Math.random().toString(36).slice(2,7);
  const entry={ts,action,opId,before:before||null,after:after||null,by:me.id};
  const d=new Date(ts);
  await db.doc('audit/'+me.id+'/months/'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())).update({e:{[eid]:entry}});
  await db.doc('audit/'+me.id).set({last:ts});
}
const FIELDS=[['date','Дата',v=>v?shortDate(v):''],['type','Тип',v=>TYPES[v]?TYPES[v].label:(v||'')],['from','З каси',v=>v?boxName(v):''],['to','В касу',v=>v?boxName(v):''],['client','Клієнт',v=>v?clientName(v):''],['amount','Сума',(v,o)=>v!=null?fmt(v,o.cur):''],['cur','Валюта',v=>v||''],['amount2','Отримано',(v,o)=>v!=null?fmt(v,o.cur2):''],['cur2','Валюта отримано',v=>v||''],['rate','Курс',v=>v!=null?fmtRate(v):''],['category','Вид',v=>v||''],['assetName','Назва ОЗ',v=>v||''],['comment','Коментар',v=>v||'']];
function diffOps(a,b){const out=[];for(const [k,l,f] of FIELDS){const x=f(a[k],a),y=f(b[k],b);if(x!==y)out.push([l,x||'—',y||'—']);}return out;}
const ACT={create:['Додано','in'],edit:['Змінено','fx'],delete:['Видалено','out']};
function entryHtml(e,showTitle){
  const o=e.after||e.before||{};const [t]=o.type?opTitle(o):['Операція'];
  const amt=o.type==='exchange'?fmt(o.amount,o.cur)+' → '+fmt(o.amount2,o.cur2):o.amount!=null?fmt(o.amount,o.cur):'';

const FORM_KINDS=[['out','−','out','видаток'],['in','+','in','прихід'],['transfer','⇄','move','переказ'],['exchange','$⇄₴','fx','обмін']];
/* What the form means in ledger terms */
function resolved(){
  const s=form;
  if(s.kind==='transfer'||s.kind==='exchange')return {type:s.kind};
  const t=s.target||'';
  if(t.startsWith('cli:'))return {type:s.kind==='out'?'clientOut':'clientIn'};
  if(t==='exp')return s.cat==='__oz'?{type:'expense',isAsset:true}:{type:'expense',category:s.cat||null};
  if(t==='inc')return {type:'income',category:s.cat||null};
  return {type:null};
}

function openForm(st){form=st;openSheet(st.id?'Редагувати операцію':'Нова операція',`<div id="form-body">${formHtml()}</div>`);updateHints();}

function fxCalc(){const a=num(form.amount),r=num(form.rate);if(!(a>0&&r>0))return null;return form.cur===BASE&&form.cur2!==BASE?r2(a/r):r2(a*r);}
function fxRate(){const a=num(form.amount),b=num(form.amount2);if(!(a>0&&b>0))return null;const r=form.cur===BASE&&form.cur2!==BASE?a/b:b/a;return Math.round(r*10000)/10000;}
function updateHints(){
  if(!form)return;
  const all=allOps();const bal=boxBalances(all,null,form.id);
  const rt=resolved();const usesFrom=rt.type==='transfer'||rt.type==='exchange'||rt.type==='clientOut'||(rt.type==='expense'&&!rt.viaClient);
  const hf=document.getElementById('h-from');

  else if(hf&&usesFrom){const have=form.from?((bal[form.from]||{})[form.cur]||0):null;const a=num(form.amount);
    if(have===null){hf.textContent='';}else{hf.textContent='У касі зараз: '+fmt(have,form.cur)+(a>have?' — не вистачає '+fmt(a-have,form.cur):'');hf.className='hint'+(a>have?' warn':'');}}
  const ht=document.getElementById('h-to');
  if(ht){const cur=form.kind==='exchange'?form.cur2:form.cur;ht.textContent=form.to&&(!isCashier()||form.to===myBox())?'У касі зараз: '+fmt((bal[form.to]||{})[cur]||0,cur):'';}
  const hc=document.getElementById('h-client');
  if(hc){const cb=clientBalances(all.filter(o=>o.id!==form.id))[form.client]||{};const ks=sortCurs(Object.keys(cb).filter(k=>Math.abs(cb[k])>=0.005));hc.textContent=form.client&&form.client!=='__new'?(ks.length?'Зараз: '+ks.map(k=>(cb[k]>0?'винен мені ':'я винен ')+fmt(Math.abs(cb[k]),k)).join(', '):'Зараз: розраховані'):'';}
  const fc=document.getElementById('fx-calc');
  if(fc&&form.kind==='exchange'){const a=num(form.amount),b=num(form.amount2);fc.textContent=a>0&&b>0?`Віддаю ${fmt(a,form.cur)} → отримую ${fmt(b,form.cur2)}`:'Вкажіть суму і курс';}

function validate(){
  const s=form,a=r2(num(s.amount)),r=resolved(),t=r.type;
  if(!s.date)return 'Вкажіть дату.';
  if(!t)return s.kind==='out'?'Оберіть, кому пішли гроші.':'Оберіть, від кого прийшли гроші.';
  if((t==='expense'&&!r.isAsset&&!r.category)||(t==='income'&&!r.category))return 'Оберіть вид.';
  if(!(a>0))return 'Вкажіть суму більше нуля.';
  const viaClient=!!r.viaClient;
  const needClient=viaClient||t==='clientIn'||t==='clientOut';
  const needFrom=!viaClient&&['expense','transfer','exchange','clientOut'].includes(t);
  const needTo=!viaClient&&['income','transfer','exchange','clientIn'].includes(t);
  if(needClient&&!s.client)return 'Оберіть клієнта.';
  if(needClient&&s.client==='__new'&&!s.newClient.trim())return "Вкажіть ім'я нового клієнта.";
  if(needFrom&&!s.from)return 'Оберіть касу, з якої йдуть гроші.';
  if(needTo&&!s.to)return 'Оберіть касу, куди йдуть гроші.';
  if(t==='transfer'&&s.from===s.to)return 'Каси мають бути різні.';
  if(isCashier()){const mb=myBox();if(t==='transfer'&&s.from!==mb&&s.to!==mb)return 'Переказ можливий тільки з вашої каси або у вашу касу.';if(t!=='transfer'&&((s.from&&s.from!==mb&&needFrom)||(s.to&&s.to!==mb&&needTo)))return 'Можна працювати тільки зі своєю касою.';if(t==='clientIn'||t==='clientOut')return 'Операції з клієнтами вам недоступні.';}
  if(t==='exchange'){if(s.cur===s.cur2)return 'Оберіть різні валюти для обміну.';if(!(r2(num(s.amount2))>0))return 'Вкажіть, скільки отримали після обміну.';}
  if(r.isAsset&&!s.assetName.trim())return 'Вкажіть назву основного засобу.';
  return '';
}
function buildOp(prev,clientId){
  const s=form,r=resolved(),t=r.type;const viaClient=!!r.viaClient;
  const op={type:t,date:s.date,payVia:(t==='expense'||t==='income')?(viaClient?'client':'box'):null,from:null,to:null,client:null,cur:s.cur,amount:r2(num(s.amount)),cur2:null,amount2:null,rate:null,category:null,isAsset:false,assetName:null,comment:(s.comment||'').trim(),deleted:false,
    by:prev?prev.by||null:me.id,ts:prev?prev.ts||Date.now():Date.now(),editedBy:prev?me.id:null,editedTs:prev?Date.now():null};
  if(!viaClient&&['expense','transfer','exchange','clientOut'].includes(t))op.from=s.from;
  if(!viaClient&&['income','transfer','exchange','clientIn'].includes(t))op.to=s.to;
  if(viaClient||t==='clientIn'||t==='clientOut')op.client=clientId;
  if(t==='exchange'){op.cur2=s.cur2;op.amount2=r2(num(s.amount2));op.rate=fxRate();}
  if(r.isAsset){op.isAsset=true;op.assetName=s.assetName.trim();op.category='Основні засоби';}
  else if(t==='expense'||t==='income')op.category=r.category;
  return op;
}

    if(k==='target'){form.cat='';if(form.target.startsWith('cli:'))form.client=form.target.slice(4);}
    if(t.dataset.redraw){redrawForm();return;}
    if(form.kind==='exchange'&&(k==='amount'||k==='rate'||k==='cur'||k==='cur2')){const b=fxCalc();if(b!=null){form.amount2=String(b);const i=document.getElementById('f-amount2');if(i)i.value=String(b).replace('.',',');}}
    if(form.kind==='exchange'&&k==='amount2'){const r=fxRate();if(r!=null){form.rate=String(r);const i=document.getElementById('f-rate');if(i)i.value=String(r).replace('.',',');}}
    updateHints();return;
  }
  if(t.dataset.jf){ui.f[t.dataset.jf]=t.value;ui.dayLimit=30;render();return;}
  if(t.dataset.eod){ui.eodDate=t.value;render();return;}
  if(t.dataset.rf){ui.rep[t.dataset.rf]=t.value;render(true);return;}
  if(t.dataset.af){ui.acc[t.dataset.af]=t.value;render(true);return;}
  if(canAdmin&&(t.dataset.borg||t.dataset.ckind||t.dataset.eacc||t.dataset.iacc)){const c=cloneCfg();c.acct=c.acct||{};
    if(t.dataset.borg){const b=c.boxes.find(x=>x.id===t.dataset.borg);if(b)b.org=t.value;}
    else{const g=t.dataset.ckind?'clients':t.dataset.eacc?'exp':'inc';const k=t.dataset.ckind||t.dataset.eacc||t.dataset.iacc;c.acct[g]=Object.assign({},c.acct[g],{[k]:t.value});}
    saveCfg(c,true);toast('Збережено');return;}
  if(t.dataset.sb&&canAdmin){const c=cloneCfg();c.boxes[+t.dataset.i][t.dataset.sb]=t.value;saveCfg(c);return;}
  if(t.dataset.rate&&canAdmin){const c=cloneCfg();c.rates=c.rates||{};const r=num(t.value);if(r>0)c.rates[t.dataset.rate]=r;else delete c.rates[t.dataset.rate];saveCfg(c);return;}
  if(t.dataset.sc&&canWrite){renameClient(t.dataset.sc,t.value);return;}
  if(t.dataset.roleuid&&isOwner){saveRole(t.dataset.roleuid,{role:t.value});return;}
  if(t.dataset.roleboxuid&&isOwner){saveRole(t.dataset.roleboxuid,{box:t.value});return;}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&form&&!t.dataset.redraw){form[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;updateHints();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet-root').innerHTML)closeSheet();});
window.addEventListener('hashchange',()=>{setTabFromHash();render(true);window.scrollTo(0,0);});

/* ---------- names ---------- */
async function resolveNames(){
  if(!user)return;
  const ids=new Set();for(const o of allOps()){if(o.by)ids.add(o.by);}for(const e of audit)if(e.by)ids.add(e.by);
  const miss=[...ids].filter(i=>!(i in names));if(!miss.length)return;
  try{const ps=await user.profiles(miss);for(const i of miss)names[i]=ps[i]&&ps[i].name||'';}catch(e){}
  if((ui.tab==='zminy'||ui.tab==='zhurnal')&&!isTyping())render();
}

/* ---------- boot ---------- */
function isTyping(){const a=document.activeElement;return a&&a.dataset&&(a.dataset.sb||a.dataset.sc||a.dataset.rate);}
let dataStarted=false,pendingDays=0,isOnline=navigator.onLine;
function setNet(){
  const el=document.getElementById('net');if(!el)return;
  if(!isOnline){el.hidden=false;el.className='net off';el.textContent='Немає інтернету. Записи зберігаються на телефоні й надішлються самі, коли з’явиться зв’язок.';}
  else if(pendingDays){el.hidden=false;el.className='net sync';el.textContent='Надсилаю записи…';}
  else el.hidden=true;
}
window.addEventListener('online',()=>{isOnline=true;setNet();});
window.addEventListener('offline',()=>{isOnline=false;setNet();});
window.addEventListener('fb-write-error',e=>{const c=e.detail&&e.detail.code||'';toast(c.includes('permission')?'Немає прав на цю дію':'Не вдалося зберегти: '+c);});
downloads={save:async({filename,data})=>{const b=new Blob([data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}};
user={profiles:async ids=>{const r={};for(const i of ids){const m=members[i];r[i]={name:(m&&m.name)||(cfg&&cfg.legacyNames&&cfg.legacyNames[i])||''};}return r;}};

function startData(){
  if(dataStarted)return;dataStarted=true;
  const fail=e=>{console.warn(e);noDb=true;render(true);};
  db.collection('members').onSnapshot(s=>{const n={};s.docs.forEach(d=>{n[d.id]=d.data()||{};});members=n;saveSnap();for(const k in n)names[k]=n[k].name||names[k]||'';resolveNames();if(ui.tab==='nalashtuvannia'&&!isTyping())render(true);},()=>{});
  db.doc('config/main').onSnapshot(s=>{
    const d=s.exists?s.data():null;
    cfg=d?Object.assign({},DEFAULT_CFG,d):null;
    if(cfg){for(const k of ['boxes','categories','incomeCategories','currencies'])if(!Array.isArray(cfg[k]))cfg[k]=DEFAULT_CFG[k].slice();if(!cfg.rates||typeof cfg.rates!=='object')cfg.rates={};}
    cfgLoaded=true;saveSnap();resolveNames();if(isTyping()){const dyn=document.getElementById('dyn');if(dyn&&ui.tab!=='nalashtuvannia')render();}else render(true);if(form)updateHints();
  },fail);
  db.collection('clients').onSnapshot(s=>{
    const n={};s.docs.forEach(d=>{const x=d.data();if(x)n[d.id]={name:x.name||'',archived:!!x.archived};});clients=n;saveSnap();
    clientsLoaded=true;if(!isTyping())render(ui.tab==='zhurnal');if(form)updateHints();
  },fail);
  db.collection('days').onSnapshot(s=>{
    const n={};let p=0;s.docs.forEach(d=>{const x=d.data();n[d.id]=x&&x.ops||{};if(d.pending)p++;});days=n;saveSnap();pendingDays=p;setNet();
    daysLoaded=true;if(!isTyping())render();if(form)updateHints();
    resolveNames();
  },fail,true);
  db.doc('data/users/'+me.id+'/prefs').get().then(p=>{auditSeen=p.exists&&+(p.data()||{}).auditSeen||0;if(!isTyping())render();}).catch(()=>{});
  db.collection('audit').onSnapshot(s=>{
    if(!s.docs.length)onAudit();
    s.docs.forEach(d=>{const u=d.id;if(auditSubs[u])return;
      auditSubs[u]=db.collection('audit/'+u+'/months').onSnapshot(ms=>{
        const list=[];ms.docs.forEach(m=>{const x=m.data();const e=x&&x.e||{};for(const k in e)if(e[k]&&e[k].action)list.push(Object.assign({id:k},e[k]));});
        auditBy[u]=list;audit=[].concat(...Object.values(auditBy));onAudit();
      },()=>{});});
  },()=>{auditLoaded=true;});
}

/* ---------- instant start: last known data saved on the phone ---------- */
let dbReadyResolve;const dbReady=new Promise(r=>dbReadyResolve=r);
const SNAP_KEY=IS_TEST?'bs.snap.test.v1':'bs.snap.v1';let snapT=null,snapRestored=false,authStarted=false;
function saveSnap(){clearTimeout(snapT);snapT=setTimeout(()=>{try{if(me&&me.id&&ownerUid)localStorage.setItem(SNAP_KEY,JSON.stringify({me,ownerUid,roles,cfg,clients,days,members}));}catch(e){}},600);}
function clearSnap(){try{localStorage.removeItem(SNAP_KEY);}catch(e){}}
function restoreSnap(){
  try{
    const x=JSON.parse(localStorage.getItem(SNAP_KEY)||'null');
    if(!x||!x.me||!x.me.id||!x.ownerUid||!x.cfg)return;
    me=x.me;ownerUid=x.ownerUid;roles=x.roles||{};cfg=x.cfg;clients=x.clients||{};days=x.days||{};members=x.members||{};
    for(const k in members)names[k]=members[k].name||'';names[me.id]=me.name;
    authState='in';ownerLoaded=true;isOwner=ownerUid===me.id;canAdmin=isOwner;rolesLoaded=true;
    const ro=myRole();canWrite=ro!=='viewer'&&ro!=='none';
    cfgLoaded=daysLoaded=clientsLoaded=true;snapRestored=true;
    document.getElementById('who').textContent=me.name;document.getElementById('logout').hidden=false;
  }catch(e){}
}

/* ---------- first run: become owner, import data ---------- */
async function claimOwner(){await setDoc(fdoc(FB.fs,'meta/owner'),{uid:me.id,email:me.email||'',ts:Date.now()});}
async function importData(file){
  const st=document.getElementById('mig-status');const say=t=>{if(st)st.textContent=t;};
  if(!navigator.onLine){say('Для перенесення потрібен інтернет.');return;}
  let data;try{data=JSON.parse(await file.text());}catch(e){say('Файл не схожий на файл перенесення.');return;}
  if(!data||data.format!=='baza-service-migration'){say('Це не той файл. Потрібен файл, який надіслав Claude.');return;}
  say('Стаю власником…');
  try{await claimOwner();}catch(e){say('Не вдалося стати власником: '+(e.code||e.message));return;}
  const writes=[];
  const cfgOut=Object.assign({},data.config||{});if(data.legacyNames)cfgOut.legacyNames=data.legacyNames;
  writes.push(['config/main',cfgOut]);
  writes.push(['roles/main',{users:{}}]);
  writes.push(['data/users/'+me.id+'/prefs',{auditSeen:Date.now()}]);
  for(const id in (data.clients||{}))writes.push(['clients/'+id,data.clients[id]]);
  for(const d in (data.days||{}))writes.push(['days/'+d,{ops:data.days[d]}]);
  const byDay={};let lastTs=0;
  for(const e of (data.audit||[])){const dt=new Date(e.ts);const k=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());const {id:eid,...rest}=e;(byDay[k]=byDay[k]||{})[eid]=rest;if(e.ts>lastTs)lastTs=e.ts;}
  for(const k in byDay)writes.push(['audit/legacy/months/'+k,{e:byDay[k]}]);
  if(Object.keys(byDay).length)writes.push(['audit/legacy',{last:lastTs}]);
  say('Переношу дані: 0 з '+writes.length+'…');
  try{
    for(let i=0;i<writes.length;i+=400){const b=writeBatch(FB.fs);for(const [p,v] of writes.slice(i,i+400))b.set(fdoc(FB.fs,p),v);await b.commit();say('Переношу дані: '+Math.min(i+400,writes.length)+' з '+writes.length+'…');}
  }catch(e){say('Помилка під час перенесення: '+(e.code||e.message)+'. Напишіть Claude.');return;}
  say('Готово! Дані перенесено.');
}
async function claimEmpty(){
  try{await claimOwner();await setDoc(fdoc(FB.fs,'config/main'),{boxes:[],categories:['Інше'],incomeCategories:['Інший дохід'],currencies:['UAH','USD'],rates:{}});await setDoc(fdoc(FB.fs,'roles/main'),{users:{}});}
  catch(e){toast('Помилка: '+(e.code||e.message));}
}

async function doLogin(){
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(FB.auth,p);}
  catch(e){
    const c=e&&e.code||'';
    if(c.includes('popup-closed')||c.includes('cancelled'))return;
    if(c.includes('popup-blocked')||c.includes('operation-not-supported')||c.includes('web-storage')){try{await signInWithRedirect(FB.auth,p);}catch(e2){toast('Помилка входу: '+(e2.code||''));}}
    else toast('Помилка входу: '+c);
  }
}

if(IS_TEST){document.title='Baza Service ТЕСТ';const h=document.querySelector('header.top h1');if(h)h.textContent='Baza Service ТЕСТ';}
setTabFromHash();restoreSnap();render(true);
loadSdk().then(()=>{
initFB();
getRedirectResult(FB.auth).catch(()=>{});
onAuthStateChanged(FB.auth,u=>{
  if(!u){clearSnap();if(snapRestored){location.reload();return;}authState='out';render(true);return;}
  if(authStarted)return;
  authStarted=true;
  if(snapRestored&&me.id!==u.uid){clearSnap();location.reload();return;}
  authState='in';
  me={id:u.uid,name:u.displayName||u.email||'',email:u.email||''};
  db=fbdb;dbReadyResolve();
  if(snapRestored&&myRole()!=='none')startData();
  document.getElementById('who').textContent=me.name;
  document.getElementById('logout').hidden=false;
  names[me.id]=me.name;
  db.doc('members/'+me.id).set({seen:Date.now(),name:me.name,email:me.email});
  db.doc('meta/owner').onSnapshot(s=>{
    ownerUid=s.exists?(s.data()||{}).uid:null;ownerLoaded=true;
    isOwner=ownerUid===me.id;canAdmin=isOwner;
    if(ownerUid&&!rolesSub){
      rolesSub=db.doc('roles/main').onSnapshot(r=>{const d=r.exists?r.data():null;roles=d&&d.users||{};rolesLoaded=true;saveSnap();
        const ro=myRole();canWrite=ro!=='viewer'&&ro!=='none';
        if(ro!=='none')startData();
        if(!isTyping())render(true);if(isOwner)resolveMemberNames();},()=>{rolesLoaded=true;render(true);});
    }
    render(true);
  },e=>{console.warn(e);ownerLoaded=true;render(true);});
});
}).catch(e=>{console.warn(e);if(!snapRestored){noDb=true;authState='in';ownerLoaded=true;ownerUid=ownerUid||'?';render(true);}});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setNet();
})();
